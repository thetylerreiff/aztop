[package]
name = "aztop"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "aztop: a local, read-only btop-style terminal viewer for Azure resources"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thetylerreiff/aztop"
homepage = "https://github.com/thetylerreiff/aztop"
documentation = "https://github.com/thetylerreiff/aztop#readme"
keywords = ["azure", "cli", "monitoring", "ratatui", "tui"]
categories = ["command-line-utilities", "visualization"]
exclude = [".github/", "scripts/", "docs/"]

[lib]
name = "aztop"
path = "src/lib.rs"

[[bin]]
name = "aztop"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "macros", "underline-color"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
